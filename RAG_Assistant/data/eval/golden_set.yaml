# Golden evaluation set for the Halcyon Ridge University handbook corpus (synthetic).
#
# Each item:
#   type      factual | paraphrase | conditional | multi_hop | unanswerable_near | unanswerable_off
#   answer    reference answer (used for token-F1)
#   facts     list of required facts; each fact is a list of acceptable spellings. ALL facts must appear.
#   evidence  verbatim phrases from the corpus that a retriever must surface. Each must occur
#             exactly once in the corpus (enforced by tests/test_data_integrity.py).
#   split     dev | test. If omitted, items alternate dev/test within each type. Tune on dev only;
#             report on test.
#
# unanswerable_near = same topic as the corpus but the fact is NOT in it (hard negatives).
# unanswerable_off  = unrelated to the corpus (easy negatives).

