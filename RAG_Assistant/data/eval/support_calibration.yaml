# Hand-labelled examples for measuring the deterministic faithfulness scorer (rag_assistant/evaluation/support.py).
# label: faithful   = every claim in `answer` is supported by `context`
#        unfaithful = at least one claim is NOT supported
# category names the failure mode being probed. Items marked expected_miss: true are cases the lexical scorer
# is KNOWN to get wrong; they are kept on purpose so the report states its blind spots instead of hiding them.

# ------------------------------------------------------------------ faithful
- id: s01
  category: verbatim
  label: faithful
  context: ["A late payment fee of $75 is charged when the balance is not paid in full by the due date, unless the student is enrolled in a payment plan."]
  answer: "A late payment fee of $75 is charged when the balance is not paid in full by the due date. [1]"

- id: s02
  category: paraphrase_same_numbers
  label: faithful
  context: ["Graduate students may borrow up to 50 items for 60 days each, with three renewals."]
  answer: "Graduate students can borrow up to 50 items, each for 60 days."

- id: s03
  category: two_sentence_synthesis
  label: faithful
  context: ["Undergraduates who want to register for more than 18 credits (an overload) need written approval from their academic dean and must hold a cumulative GPA of at least 3.3. No undergraduate may register for more than 21 credits in any term, regardless of GPA."]
  answer: "To take more than 18 credits you need your dean's written approval and a cumulative GPA of at least 3.3, and nobody may exceed 21 credits in a term."

